<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz App Job Companion</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      margin: 0;
      color: #333;
    }
    
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #eee;
      padding-bottom: 12px;
    }
    
    .logo {
      width: 32px;
      height: 32px;
      margin-right: 8px;
    }
    
    h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
      color: #6f42c1;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    
    .toggle-label {
      font-size: 14px;
      font-weight: 500;
    }
    
    .toggle {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }
    
    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    
    input:checked + .slider {
      background-color: #6f42c1;
    }
    
    input:checked + .slider:before {
      transform: translateX(22px);
    }
    
    .section {
      margin-top: 20px;
    }
    
    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    
    .quiz-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    
    .quiz-item {
      padding: 8px 0;
      border-bottom: 1px solid #f0f0f0;
      font-size: 14px;
    }
    
    .quiz-item:last-child {
      border-bottom: none;
    }
    
    .btn {
      display: inline-block;
      background-color: #6f42c1;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s;
      margin-top: 16px;
    }
    
    .btn:hover {
      background-color: #553098;
    }
    
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="images/icon48.png" alt="Quiz App Logo" class="logo">
    <h1>Quiz App Job Companion</h1>
  </div>
  
  <div class="toggle-container">
    <span class="toggle-label">Enable quiz suggestions</span>
    <label class="toggle">
      <input type="checkbox" id="enableToggle" checked>
      <span class="slider"></span>
    </label>
  </div>
  
  <div class="section">
    <div class="section-title">Available Quizzes</div>
    <ul class="quiz-list">
      <li class="quiz-item">React Fundamentals Quiz</li>
      <li class="quiz-item">JavaScript Core Concepts</li>
      <li class="quiz-item">Angular Essentials</li>
    </ul>
  </div>
  
  <a href="https://thinkify-quiz.vercel.app//user/dashboard" target="_blank" class="btn">View All Quizzes</a>
  
  <div class="footer">
    <p>Improve your job prospects by testing your skills!</p>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
