<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thinkify Quiz Recommender</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 350px;
      min-height: 400px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .popup-container {
      padding: 0;
    }
    
    .header {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    
    .logo-icon {
      font-size: 24px;
    }
    
    .logo-text {
      font-size: 18px;
      font-weight: 700;
    }
    
    .subtitle {
      font-size: 14px;
      opacity: 0.9;
    }
    
    .content {
      padding: 20px;
    }
    
    .section {
      margin-bottom: 20px;
    }
    
    .section-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .toggle-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.1);
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    
    .toggle-label {
      font-size: 14px;
    }
    
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .toggle-switch.active {
      background: #48bb78;
    }
    
    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    
    .toggle-switch.active::after {
      transform: translateX(20px);
    }
    
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    .stat-card {
      background: rgba(255, 255, 255, 0.1);
      padding: 16px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-number {
      font-size: 24px;
      font-weight: 700;
      line-height: 1;
    }
    
    .stat-label {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
    }
    
    .quiz-types {
      margin-top: 12px;
    }
    
    .quiz-type-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    
    .quiz-type-item:last-child {
      border-bottom: none;
    }
    
    .quiz-type-name {
      font-size: 14px;
    }
    
    .quiz-type-count {
      font-weight: 600;
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    
    .button {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    
    .button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }
    
    .button.secondary {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.3);
      margin-top: 8px;
    }
    
    .footer {
      background: rgba(255, 255, 255, 0.1);
      padding: 16px 20px;
      text-align: center;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }
    
    .footer-text {
      font-size: 12px;
      opacity: 0.8;
    }
    
    .footer-link {
      color: white;
      text-decoration: none;
      font-weight: 600;
    }
    
    .footer-link:hover {
      text-decoration: underline;
    }
    
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-size: 14px;
      opacity: 0.8;
    }
    
    .error {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      padding: 12px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <div class="logo">
        <span class="logo-icon">🎯</span>
        <span class="logo-text">Thinkify</span>
      </div>
      <div class="subtitle">Quiz Recommender</div>
    </div>
    
    <div class="content">
      <!-- Settings Section -->
      <div class="section">
        <div class="section-title">
          ⚙️ Settings
        </div>
        
        <div class="toggle-container">
          <span class="toggle-label">Enable Recommendations</span>
          <div class="toggle-switch" id="enableToggle"></div>
        </div>
        
        <div class="toggle-container">
          <span class="toggle-label">Show Relevance Score</span>
          <div class="toggle-switch" id="relevanceToggle"></div>
        </div>
      </div>
      
      <!-- Analytics Section -->
      <div class="section">
        <div class="section-title">
          📊 Analytics
        </div>
        
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-number" id="totalClicks">-</div>
            <div class="stat-label">Total Clicks</div>
          </div>
          <div class="stat-card">
            <div class="stat-number" id="weekClicks">-</div>
            <div class="stat-label">This Week</div>
          </div>
        </div>
        
        <div class="quiz-types" id="quizTypes">
          <!-- Quiz type stats will be populated here -->
        </div>
        
        <button class="button secondary" id="clearAnalytics">
          Clear Analytics Data
        </button>
      </div>
      
      <!-- Quick Actions -->
      <div class="section">
        <div class="section-title">
          🚀 Quick Actions
        </div>
        
        <button class="button" id="visitPlatform">
          Visit Thinkify Platform
        </button>
        
        <button class="button secondary" id="reportIssue">
          Report Issue
        </button>
      </div>
    </div>
    
    <div class="footer">
      <div class="footer-text">
        Powered by <a href="https://thinkify-quiz.vercel.app" target="_blank" class="footer-link">Thinkify Quiz Platform</a>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
